<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EJ的研習講義</title>
  <meta name="description" content="EJ的研習講義與提示詞共享中心，提供一鍵複製提示詞、關鍵字過濾、課堂投影二維碼與實作計時器">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- 主樣式表 -->
  <link rel="stylesheet" href="css/style.css?v=20261108_3d_elevation">
</head>
<body>

  <!-- 頂部漸層氛圍光暈 -->
  <div class="ambient-glow"></div>

  <!-- 頂部導覽列 -->
  <header class="site-nav">
    <div class="container nav-inner">
      <a href="javascript:void(0)" onclick="navigateToPortal()" class="brand-badge" title="返回場次總覽">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
            <path d="M2 17l10 5 10-5"></path>
            <path d="M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>EJ的研習講義</h1>
          <span>教學鷹架・提示詞導航・課堂掌控</span>
        </div>
      </a>

      <div class="nav-actions">
        <!-- 返回場次選單按鈕（進入特定場次時顯示） -->
        <button type="button" class="nav-btn" id="navBackBtn" style="display: none;" onclick="navigateToPortal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          回場次列表
        </button>

        <!-- 視覺主題切換 -->
        <button type="button" class="nav-btn" id="themeToggleBtn" onclick="toggleTheme()" title="切換深淺模式（投影切換）">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          模式
        </button>

        <!-- 快速編輯工具 -->
        <a href="admin.html" class="nav-btn primary" title="離線編輯場次與提示詞資料">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          備課小工具
        </a>
      </div>
    </div>
  </header>

  <!-- 主要內容區（由 JS 動態切換 首頁 / 單一場次） -->
  <main class="container" id="mainContent">
    <div style="text-align: center; padding: 100px 0;">
      <div style="display: inline-block; width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p style="margin-top: 16px; color: var(--text-muted); font-size: 0.95rem;">正在載入研習場次資料...</p>
    </div>
  </main>

  <!-- 課堂投影 QR Code 模態彈窗 -->
  <div class="modal-overlay" id="qrModal" onclick="if(event.target === this) closeQrModal()">
    <div class="modal-dialog">
      <button type="button" class="modal-close-btn" onclick="closeQrModal()">&times;</button>
      <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 6px;">📱 掃描二維碼進入教材頁</h3>
      <p id="qrModalTitle" style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 12px;"></p>
      
      <div class="qr-preview-box">
        <img id="qrModalImg" src="" alt="研習 QR Code">
      </div>

      <div class="modal-url-display" id="qrModalUrl"></div>
      <p style="font-size: 0.8rem; color: var(--text-light); margin-top: 12px;">提示：可將此視窗投影至大螢幕，方便學員手機或筆電直接掃入。</p>
    </div>
  </div>

  <!-- 課堂實作浮動計時器 -->
  <div class="timer-bar" id="timerBar">
    <div>
      <div id="timerTitle" style="font-size: 0.82rem; font-weight: 700; color: var(--text-muted); margin-bottom: 2px;">⏱️ 實作計時</div>
      <div class="timer-display" id="timerDisplay">05:00</div>
    </div>
    <div style="display: flex; gap: 8px;">
      <button type="button" class="nav-btn" onclick="stopTimer()" style="padding: 6px 12px; font-size: 0.8rem;">結束</button>
    </div>
  </div>

  <!-- 頁尾 -->
  <footer class="site-footer">
    <div class="container">
      <p>EJ的研習講義 &copy; 2026・專為素養導向教育與工作坊講課推進打造</p>
    </div>
  </footer>

  <!-- 應用腳本 -->
  <script src="js/app.js"></script>
</body>
</html>
